#aria2c config

# https://aria2.github.io/manual/en/html/aria2c.html#files

on-download-complete=${HOME}/.config/aria2/scripts/complete.sh
on-download-start=${HOME}/.config/aria2/scripts/start.sh
on-download-stop=${HOME}/.config/aria2/scripts/stop.sh
on-download-pause=${HOME}/.config/aria2/scripts/pause.sh
on-download-error=${HOME}/.config/aria2/scripts/error.sh
dir=${HOME}/Downloads
seed-time=0
continue=true

# rpc config
enable-rpc=true
rpc-allow-origin-all=true
rpc-listen-all=true
rpc-listen-port=6800
rpc-secret=coba123
